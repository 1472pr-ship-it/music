<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5c2028">

    <!-- 검색엔진 노출 및 링크 수집 차단 -->
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #ffffff; color: #332d29; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header & Main Button (반주실 스타일 적용) */
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: linear-gradient(135deg, #5c2028, #8b3a42); 
            color: #ffffff; 
            padding: 10px 14px; 
        }
        .header h1 { 
            font-size: 18px; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            color: #fcf8f2; 
            margin: 0;
        }
        .btn-home {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            text-decoration: none;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        .btn-home:active { background-color: rgba(255, 255, 255, 0.35); }

        /* Filter Section */
        .filter-section { background-color: #f5efe6; border-bottom: 1px solid #e5dccf; padding: 5px 8px; display: flex; flex-direction: column; gap: 4px; }
        .filter-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; width: 100%; }
        .filter-label { font-size: 11px; font-weight: bold; color: #4a382c; min-width: 50px; background: #e6dacb; padding: 3px 4px; border-radius: 4px; text-align: center; flex-shrink: 0; white-space: nowrap; }
        .filter-buttons { display: flex; gap: 3px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 1px; flex-grow: 1; }
        .filter-buttons::-webkit-scrollbar { display: none; }
        .btn-filter { padding: 3px 6px; font-size: 11.5px; font-weight: 600; color: #54473e; background: #ffffff; border: 1px solid #d9ccbc; border-radius: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .btn-filter.active { background-color: #8b3a42; color: #ffffff; border-color: #8b3a42; }
        .btn-filter-sub.active { background-color: #8c6d3f; color: #ffffff; border-color: #8c6d3f; }

        /* Player Section */
        .player-section { background: #f0e6df; border-bottom: 2px solid #8b3a42; color: #4a2c2a; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }

        audio { width: 100%; height: 38px; outline: none; border-radius: 6px; }
        .bg-notice { font-size: 11px; color: #7a6058; letter-spacing: -0.3px; margin-top: 1px; }

        /* Control Bar */
        .control-bar { background-color: #fcf9f5; border-bottom: 1px solid #eee5da; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; }
        .btn-group { display: flex; gap: 6px; }
        .btn { background-color: #ffffff; border: 1px solid #d1c2b1; color: #4a3d34; padding: 5px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background-color: #8b3a42; color: #ffffff; border-color: #8b3a42; }

        /* Table Area */
        .table-responsive { width: 100%; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 14.5px; text-align: left; table-layout: fixed; }
        thead { background-color: #f2e9de; border-bottom: 2px solid #8b3a42; }
        th, td { padding: 7px 4px; border-bottom: 1px solid #ede3d8; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        th { color: #4a3a2f; font-weight: 700; font-size: 13.5px; }
        tr:hover { background-color: #faf5ef; }

        .col-chk { width: 30px; text-align: center; }
        .col-chk input { transform: scale(1.15); }

        .col-artist { width: 58px; color: #59493e; text-align: center; font-size: 13px; display: table-cell; }

        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px; background-color: #fbf6ef; border-top: 2px solid #8b3a42; }
        .page-btn { padding: 6px 14px; font-size: 14px; font-weight: bold; color: #54473e; background: #ffffff; border: 1px solid #d1c2b1; border-radius: 5px; cursor: pointer; }
        .page-btn.active { background-color: #8b3a42; color: #ffffff; border-color: #8b3a42; }

        /* --- [댓글 영역] --- */
        .comment-section { background-color: #fcfbf9; border-top: 3px solid #8b3a42; padding: 16px 12px; margin-top: 10px; }
        .comment-header { font-size: 15px; font-weight: bold; color: #5c2028; margin-bottom: 6px; }
        .comment-notice { font-size: 12px; color: #78675a; margin-bottom: 12px; line-height: 1.4; }
        .comment-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; background: #fff; padding: 12px; border: 1px solid #e5dccf; border-radius: 6px; }
        
        .comment-input-name { width: 140px; padding: 8px 10px; font-size: 13.5px; border: 1px solid #d1c2b1; border-radius: 4px; }
        .comment-input-textarea { width: 100%; min-height: 70px; padding: 8px 10px; font-size: 14px; font-family: inherit; border: 1px solid #d1c2b1; border-radius: 4px; resize: vertical; line-height: 1.4; }
        .btn-submit-comment { width: 100%; padding: 11px; background-color: #8b3a42; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; }
        
        .comment-list { display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: #ffffff; border: 1px solid #eee5da; border-radius: 6px; padding: 10px 12px; }
        .comment-author { font-size: 13px; font-weight: bold; color: #5c2028; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .comment-date { font-size: 11px; color: #8c7b6e; font-weight: normal; margin-left: 6px; }
        .comment-body { font-size: 14px; color: #332d29; line-height: 1.5; word-break: break-all; margin-top: 2px; white-space: pre-wrap; }
        .action-btns { display: flex; gap: 8px; margin-top: 6px; }
        .reply-btn { font-size: 11.5px; background: none; border: none; cursor: pointer; text-decoration: underline; font-weight: bold; color: #8c6d3f; }
        .edit-btn { font-size: 11px; background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-weight: bold; margin-right: 4px; }
        .del-btn { font-size: 11px; background: #f2d7d7; color: #900; border: 1px solid #e0b0b0; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .reply-list { margin-top: 8px; padding-left: 10px; border-left: 2px solid #ebdcd0; display: flex; flex-direction: column; gap: 6px; }
        .reply-item { background: #faf5ef; padding: 6px 10px; border-radius: 4px; }
        .reply-form { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }

</head>

<!-- Firebase SDK 모듈 로드 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove, setDoc, increment, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAw8hem90scCf0X_NNpvQxXdaTy1XIiE84",
        authDomain: "suharmo.firebaseapp.com",
        projectId: "suharmo",
        storageBucket: "suharmo.firebasestorage.app",
        messagingSenderId: "479461638228",
        appId: "1:479461638228:web:0c6665c9aa659cc7d62dc1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_PW = "0906";

    let editingCommentId = null;
    let commentsCache = {};

    // --- [Firebase 조회수 불러오기 & 증가 전역 연동] ---
    window.dbViews = {};

    // 1. Firebase에서 누적 조회수 데이터 가져오기
    window.loadFirebaseViews = async function() {
        try {
            const querySnapshot = await getDocs(collection(db, "song_views"));
            querySnapshot.forEach((docSnap) => {
                window.dbViews[docSnap.id] = docSnap.data().count || 0;
            });
            if (typeof window.applyViewsToPlaylist === 'function') {
                window.applyViewsToPlaylist();
            }
        } catch (e) {
            console.error("조회수 로드 실패:", e);
        }
    };

    // 2. 곡 재생 시 Firebase에 +1 증가 시키기
    window.incrementSongView = async function(songId, defaultViews = 0) {
        try {
            const viewRef = doc(db, "song_views", String(songId));
            
            // 만약 Firebase에 데이터가 아예 없다면 songs.json 기본값 + 1 로 시작
            if (window.dbViews[songId] === undefined && defaultViews > 0) {
                await setDoc(viewRef, { count: defaultViews + 1 }, { merge: true });
                window.dbViews[songId] = defaultViews + 1;
            } else {
                await setDoc(viewRef, { count: increment(1) }, { merge: true });
                window.dbViews[songId] = (window.dbViews[songId] || 0) + 1;
            }
            
            if (typeof window.applyViewsToPlaylist === 'function') {
                window.applyViewsToPlaylist();
            }
        } catch (e) {
            console.error("조회수 증가 실패:", e);
        }
    };

    // 페이지 진입 시 조회수 가져오기 실행
    window.loadFirebaseViews();

    function isSpamText(text) {
        const spamKeywords = ['http://', 'https://', 'www.', '카지노', '바카라', '대출', '토토', '성인'];
        const lowerText = text.toLowerCase();
        return spamKeywords.some(keyword => lowerText.includes(keyword));
    }

    window.autoResizeTextarea = function(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    };

    window.addComment = async function() {
        const nameInput = document.getElementById('c-name');
        const textInput = document.getElementById('c-text');
        
        const name = nameInput.value.trim();
        const text = textInput.value.trim();

        if (!name) {
            alert('성함이나 닉네임을 입력해 주세요^^');
            nameInput.focus();
            return;
        }

        if (!text) {
            alert('감상평 내용을 입력해 주세요^^');
            textInput.focus();
            return;
        }

        if (isSpamText(text) || isSpamText(name)) {
            alert('광고성 문구나 인터넷 주소는 입력할 수 없습니다.');
            return;
        }

        try {
            if (editingCommentId) {
                const commentRef = doc(db, "comments", editingCommentId);
                await updateDoc(commentRef, {
                    name: name,
                    text: text,
                    isEdited: true
                });
                alert('댓글이 수정되었습니다!');
                cancelEditComment();
            } else {
                await addDoc(collection(db, "comments"), {
                    name: name,
                    text: text,
                    createdAt: new Date(),
                    dateStr: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    replies: []
                });
                textInput.value = '';
                textInput.style.height = '70px';
            }
        } catch (e) {
            console.error("댓글 저장/수정 실패:", e);
            alert("처리 중 오류가 발생했습니다.");
        }
    };

    window.startEditComment = function(commentId) {
        const item = commentsCache[commentId];
        if (!item) return;

        editingCommentId = commentId;
        
        const nameInput = document.getElementById('c-name');
        const textInput = document.getElementById('c-text');
        const submitBtn = document.getElementById('c-submit-btn');
        const cancelBtn = document.getElementById('c-cancel-btn');

        nameInput.value = item.name;
        textInput.value = item.text;
        autoResizeTextarea(textInput);

        submitBtn.innerText = "수정 완료";
        submitBtn.style.backgroundColor = "#2196F3";
        cancelBtn.style.display = "inline-block";

        document.getElementById('main-comment-form').scrollIntoView({ behavior: 'smooth' });
    };

    window.cancelEditComment = function() {
        editingCommentId = null;
        
        const nameInput = document.getElementById('c-name');
        const textInput = document.getElementById('c-text');
        const submitBtn = document.getElementById('c-submit-btn');
        const cancelBtn = document.getElementById('c-cancel-btn');

        nameInput.value = '';
        textInput.value = '';
        textInput.style.height = '70px';

        submitBtn.innerText = "등록하기";
        submitBtn.style.backgroundColor = "#8b3a42";
        cancelBtn.style.display = "none";
    };

    window.startEditReply = function(commentId, replyId, oldName, oldText) {
        const replyItemEl = document.getElementById(`reply-item-${replyId}`);
        if (!replyItemEl) return;

        replyItemEl.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:6px; margin-top:4px;">
                <input type="text" id="edit-r-name-${replyId}" class="comment-input-name" style="width:110px;" value="${oldName}">
                <textarea id="edit-r-text-${replyId}" class="comment-input-textarea" style="min-height:50px;" oninput="autoResizeTextarea(this)">${oldText}</textarea>
                <div style="display:flex; gap:4px;">
                    <button class="btn-submit-comment" style="padding:6px; font-size:12px; background-color:#2196F3;" onclick="saveReplyEdit('${commentId}', '${replyId}')">수정 완료</button>
                    <button class="btn-submit-comment" style="padding:6px; font-size:12px; background-color:#78675a;" onclick="location.reload()">취소</button>
                </div>
            </div>
        `;
    };

    window.saveReplyEdit = async function(commentId, replyId) {
        const newName = document.getElementById(`edit-r-name-${replyId}`).value.trim();
        const newText = document.getElementById(`edit-r-text-${replyId}`).value.trim();

        if (!newName || !newText) {
            alert('성함과 내용을 모두 입력해 주세요.');
            return;
        }

        try {
            const commentRef = doc(db, "comments", commentId);
            const parentComment = commentsCache[commentId];
            if (!parentComment || !parentComment.replies) return;

            const updatedReplies = parentComment.replies.map(r => {
                if (r.id === replyId) {
                    return { ...r, name: newName, text: newText };
                }
                return r;
            });

            await updateDoc(commentRef, { replies: updatedReplies });
            alert('답글이 수정되었습니다!');
        } catch (e) {
            console.error("답글 수정 실패:", e);
            alert("답글 수정에 실패했습니다.");
        }
    };

    window.addReply = async function(commentId) {
        const replyInput = document.getElementById(`reply-input-${commentId}`);
        const replyNameInput = document.getElementById(`reply-name-${commentId}`);
        const text = replyInput.value.trim();
        const name = replyNameInput.value.trim();

        if (!name) {
            alert('성함을 입력해 주세요.');
            replyNameInput.focus();
            return;
        }

        if (!text) {
            alert('답글 내용을 입력해 주세요.');
            replyInput.focus();
            return;
        }

        if (isSpamText(text) || isSpamText(name)) {
            alert('광고성 문구는 입력할 수 없습니다.');
            return;
        }

        try {
            const commentRef = doc(db, "comments", commentId);
            const replyData = {
                id: String(Date.now()),
                name: name,
                text: text,
                dateStr: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };
            await updateDoc(commentRef, {
                replies: arrayUnion(replyData)
            });
        } catch (e) {
            console.error("답글 저장 실패:", e);
        }
    };

    window.deleteComment = async function(commentId, replyObject = null) {
        const inputPw = prompt('선생님 전용 비밀번호를 입력해 주세요:');
        if (inputPw !== ADMIN_PW) {
            alert('비밀번호가 올바르지 않습니다.');
            return;
        }

        try {
            if (replyObject) {
                const commentRef = doc(db, "comments", commentId);
                await updateDoc(commentRef, {
                    replies: arrayRemove(replyObject)
                });
            } else {
                await deleteDoc(doc(db, "comments", commentId));
            }
        } catch (e) {
            console.error("삭제 실패:", e);
        }
    };

    window.toggleReplyForm = function(commentId) {
        const form = document.getElementById(`reply-form-box-${commentId}`);
        if (form) form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    };

    const q = query(collection(db, "comments"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        const box = document.getElementById('comment-list-box');
        if (snapshot.empty) {
            box.innerHTML = `<div style="text-align:center; padding:20px; color:#8c7b6e; font-size:13px;">아직 작성된 감상평이 없습니다. 첫 소감을 남겨보세요!</div>`;
            return;
        }

        box.innerHTML = '';
        commentsCache = {};

        snapshot.forEach((docSnap) => {
            const item = docSnap.data();
            const id = docSnap.id;
            commentsCache[id] = item;

            const div = document.createElement('div');
            div.className = 'comment-item';

            let repliesHtml = '';
            if (item.replies && item.replies.length > 0) {
                repliesHtml += `<div class="reply-list">`;
                item.replies.forEach(r => {
                    const rJson = JSON.stringify(r).replace(/"/g, '&quot;');
                    const safeName = r.name.replace(/'/g, "\\'");
                    const safeText = r.text.replace(/'/g, "\\'").replace(/\n/g, "\\n");
                    
                    repliesHtml += `
                        <div class="reply-item" id="reply-item-${r.id}">
                            <div class="comment-author">
                                <span>↪ ${r.name} <span class="comment-date">${r.dateStr}</span></span>
                                <div>
                                    <button class="edit-btn" onclick="startEditReply('${id}', '${r.id}', '${safeName}', '${safeText}')">수정</button>
                                    <button class="del-btn" onclick="deleteComment('${id}', ${rJson})">삭제</button>
                                </div>
                            </div>
                            <div class="comment-body">${r.text}</div>
                        </div>
                    `;
                });
                repliesHtml += `</div>`;
            }

            const editedTag = item.isEdited ? `<span style="font-size:10.5px; color:#8c6d3f; font-weight:normal;"> (수정됨)</span>` : '';

            div.innerHTML = `
                <div class="comment-author">
                    <span>👤 ${item.name} <span class="comment-date">${item.dateStr}${editedTag}</span></span>
                    <div>
                        <button class="edit-btn" onclick="startEditComment('${id}')">수정</button>
                        <button class="del-btn" onclick="deleteComment('${id}')">삭제</button>
                    </div>
                </div>
                <div class="comment-body">${item.text}</div>
                
                <div class="action-btns">
                    <button class="reply-btn" onclick="toggleReplyForm('${id}')">답글 달기</button>
                </div>

                <div id="reply-form-box-${id}" class="reply-form" style="display:none;">
                    <div>
                        <input type="text" id="reply-name-${id}" class="comment-input-name" style="width:110px;" value="수하모">
                    </div>
                    <div>
                        <textarea id="reply-input-${id}" class="comment-input-textarea" style="min-height:50px;" placeholder="답글 작성..." oninput="autoResizeTextarea(this)"></textarea>
                    </div>
                    <button class="btn-submit-comment" style="padding:8px; font-size:13px;" onclick="addReply('${id}')">답글 등록</button>
                </div>
                ${repliesHtml}
            `;
            box.appendChild(div);
        });
    });
</script>

<script>
    const GH_USER = "1472pr-ship-it";
    const GH_REPO = "music";

    let masterPlaylist = [];
    let wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    async function loadSongs() {
        try {
            const response = await fetch('songs.json');
            const songData = await response.json();
            
            masterPlaylist = songData.map((item) => {
                // 🔥 Cloudflare R2 전용 음원 주소로 자동 변경 (play/ 또는 mr/ 폴더 포함)
                let streamUrl = `https://pub-3d4a1704561a4f5395902cf81530c3c0.r2.dev/${item.fileName.split('/').map(encodeURIComponent).join('/')}`;
                
                const initialViews = item.views !== undefined ? item.views : 0;
                const finalViews = window.dbViews[item.id] !== undefined ? window.dbViews[item.id] : initialViews;

                return {
                    id: item.id,
                    mainCategory: item.cat,
                    mood: item.mood,
                    title: item.title,
                    period: item.period || "-",
                    artist: "수하모",
                    defaultViews: initialViews,
                    views: finalViews,
                    src: streamUrl
                };
            });

            applyFilters();
        } catch (error) {
            console.error("songs.json 로드 실패:", error);
        }
    }

    window.applyViewsToPlaylist = function() {
        if (!masterPlaylist) return;
        masterPlaylist.forEach(song => {
            if (window.dbViews[song.id] !== undefined) {
                song.views = window.dbViews[song.id];
            }
        });
        renderPlaylist();
    };

    let currentMainFilter = '전체';
    let currentMoodFilter = '전체';
    let currentFilteredPlaylist = [];

    let currentPage = 1;
    const itemsPerPage = 30; 

    let playlistQueue = [];
    let currentQueueIndex = 0;
    let isRepeatSingleMode = false;

    const audioPlayer = document.getElementById('audio-player');
    const nowPlayingTitle = document.getElementById('now-playing-title');

    window.onload = function() {
        loadSongs();
    };

    function truncateTitle(title) {
        const isMobile = window.innerWidth <= 600;
        if (isMobile && title.length > 12) {
            return title.substring(0, 12) + '...';
        }
        return title;
    }

    window.onresize = function() { renderPlaylist(); };

    function setMainCategory(categoryName, btn) {
        document.querySelectorAll('.btn-main').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentMainFilter = categoryName;
        currentPage = 1;
        applyFilters();
    }

    function setMoodCategory(moodName, btn) {
        document.querySelectorAll('.btn-sub').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentMoodFilter = moodName;
        currentPage = 1;
        applyFilters();
    }

    function applyFilters() {
        const chkAll = document.getElementById('chk-all');
        if (chkAll) chkAll.checked = false;

        currentFilteredPlaylist = masterPlaylist.filter(song => {
            const matchMain = (currentMainFilter === '전체') || (song.mainCategory === currentMainFilter);
            const matchMood = (currentMoodFilter === '전체') || (song.mood === currentMoodFilter);
            return matchMain && matchMood;
        });

        renderPlaylist();
    }

    let checkedSongIds = new Set();

    function updateCheckedSet() {
        document.querySelectorAll('.song-chk').forEach(chk => {
            const val = parseInt(chk.value);
            if (chk.checked) checkedSongIds.add(val);
            else checkedSongIds.delete(val);
        });
    }

    function renderPlaylist() {
        updateCheckedSet();

        const tbody = document.getElementById('playlist-body');
        tbody.innerHTML = '';

        const totalItems = currentFilteredPlaylist.length;
        document.getElementById('total-count').innerText = `총 ${totalItems}곡`;

        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:20px; color:#78675a; font-size:14px;">곡이 없습니다.</td></tr>`;
            document.getElementById('pagination-box').innerHTML = '';
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
        const pageData = currentFilteredPlaylist.slice(startIndex, endIndex);

        pageData.forEach((song, index) => {
            const displayNum = totalItems - (startIndex + index);
            const numStr = String(displayNum).padStart(2, '0');
            const displayTitle = truncateTitle(song.title);
            const isChecked = checkedSongIds.has(song.id) ? 'checked' : '';

            const tr = document.createElement('tr');
            tr.id = `row-${song.id}`;
            tr.innerHTML = `
                <td class="col-chk"><input type="checkbox" class="song-chk" value="${song.id}" ${isChecked} onchange="updateCheckedSet()"></td>
                <td class="col-num">${numStr}</td>
                <td class="col-cat"><span class="badge-main">${song.mainCategory}</span></td>
                <td class="col-title" title="${song.title}">${displayTitle}</td>
                <td class="col-period">${song.period}</td>
                <td class="col-artist">${song.artist}</td>
                <td class="col-views">${song.views}</td>
                <td class="col-action">
                    <button class="btn-play-single" onclick="playSingle(${song.id})">듣기</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPagination(totalItems);
    }

    function renderPagination(totalItems) {
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        const pageBox = document.getElementById('pagination-box');
        pageBox.innerHTML = '';

        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-btn';
        prevBtn.innerText = '◀';
        prevBtn.disabled = (currentPage === 1);
        prevBtn.onclick = () => { currentPage--; renderPlaylist(); };
        pageBox.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const numBtn = document.createElement('button');
            numBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            numBtn.innerText = i;
            numBtn.onclick = () => { currentPage = i; renderPlaylist(); };
            pageBox.appendChild(numBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-btn';
        nextBtn.innerText = '▶';
        nextBtn.disabled = (currentPage === totalPages);
        nextBtn.onclick = () => { currentPage++; renderPlaylist(); };
        pageBox.appendChild(nextBtn);
    }

    function toggleSelectAll() {
        const chks = document.querySelectorAll('.song-chk');
        const mainChk = document.getElementById('chk-all');
        let shouldSelectAll = false;
        chks.forEach(chk => { if (!chk.checked) shouldSelectAll = true; });
        if (mainChk) mainChk.checked = shouldSelectAll;
        chks.forEach(chk => {
            chk.checked = shouldSelectAll;
            const val = parseInt(chk.value);
            if (shouldSelectAll) checkedSongIds.add(val);
            else checkedSongIds.delete(val);
        });
    }

    function toggleHeaderCheckbox() {
        const mainChk = document.getElementById('chk-all');
        const chks = document.querySelectorAll('.song-chk');
        const isChecked = mainChk.checked;
        chks.forEach(chk => {
            chk.checked = isChecked;
            const val = parseInt(chk.value);
            if (isChecked) checkedSongIds.add(val);
            else checkedSongIds.delete(val);
        });
    }

    function playSingle(id) {
        const songIndex = currentFilteredPlaylist.findIndex(s => s.id === id);
        if (songIndex !== -1) {
            isRepeatSingleMode = false;
            playlistQueue = currentFilteredPlaylist.slice(songIndex);
            currentQueueIndex = 0;
            startPlayback();
        }
    }

    function playSelected() {
        updateCheckedSet();
        if (checkedSongIds.size === 0) {
            alert('재생할 곡을 선택해 주세요.');
            return;
        }

        playlistQueue = [];
        masterPlaylist.forEach(song => {
            if (checkedSongIds.has(song.id)) playlistQueue.push(song);
        });

        isRepeatSingleMode = (playlistQueue.length === 1);
        currentQueueIndex = 0;
        startPlayback();
    }

    function startPlayback() {
        if (playlistQueue.length === 0 || currentQueueIndex >= playlistQueue.length) return;

        const song = playlistQueue[currentQueueIndex];

        // 🔥 직접 재생 및 연속 재생 시 Firebase 조회수 +1 저장
        if (typeof window.incrementSongView === 'function') {
            window.incrementSongView(song.id, song.defaultViews);
        }

        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const activeRow = document.getElementById('row-' + song.id);
        if (activeRow) activeRow.classList.add('active-row');

        if (isRepeatSingleMode) {
            nowPlayingTitle.innerText = `🔂 [1곡 무한반복] ${song.title} - ${song.artist}`;
        } else {
            nowPlayingTitle.innerText = `▶️ [재생 중 ${currentQueueIndex + 1}/${playlistQueue.length}] ${song.title} - ${song.artist}`;
        }

        // 🔥 모바일 오디오 재생 제어 안정화
        audioPlayer.src = song.src;
        audioPlayer.load(); // 모바일 미디어 버퍼 초기화
        
        const playPromise = audioPlayer.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                requestWakeLock();
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: song.title,
                        artist: song.artist,
                        album: "수하모 연주 성장실",
                        artwork: [{ src: 'https://raw.githubusercontent.com/1472pr-ship-it/music/main/icon.png', sizes: '512x512', type: 'image/png' }]
                    });
                    navigator.mediaSession.setActionHandler('play', () => { audioPlayer.play(); });
                    navigator.mediaSession.setActionHandler('pause', () => { audioPlayer.pause(); });
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        if (currentQueueIndex > 0) { currentQueueIndex--; startPlayback(); }
                    });
                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        currentQueueIndex++;
                        if (currentQueueIndex >= playlistQueue.length) currentQueueIndex = 0;
                        startPlayback();
                    });
                }
            }).catch(e => {
                console.log("모바일 자동재생 제한:", e);
            });
        }
    }

    audioPlayer.onended = function() {
        if (isRepeatSingleMode) {
            startPlayback();
        } else {
            currentQueueIndex++;
            if (currentQueueIndex >= playlistQueue.length) currentQueueIndex = 0; 
            startPlayback();
        }
    };

    audioPlayer.onerror = function() {
        setTimeout(() => {
            if (playlistQueue.length > 0) startPlayback();
        }, 1000);
    };

    // 🚀 --- [PWA 설치 중복 팝업 제어 및 감춤 제어 로직] ---
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
        if (window.matchMedia('(display-mode: standalone)').matches || localStorage.getItem('pwaInstalled') === 'true') {
            e.preventDefault();
            return false;
        }

        e.preventDefault();
        deferredPrompt = e;
    });

    window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwaInstalled', 'true');
        deferredPrompt = null;
    });
</script>

</body>
</html>
