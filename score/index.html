<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove, setDoc, increment, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAw8hem90scCf0X_NNpvQxXdaTy1XIiE84",
        authDomain: "suharmo.firebaseapp.com",
        projectId: "suharmo",
        storageBucket: "suharmo.firebasestorage.app",
        messagingSenderId: "479461638228",
        appId: "1:479461638228:web:0c6665c9aa659cc7d62dc1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_PW = "0906";

    let editingCommentId = null;
    let commentsCache = {};

    window.dbViews = {};

    window.loadFirebaseViews = async function() {
        try {
            const querySnapshot = await getDocs(collection(db, "sheet_views"));
            querySnapshot.forEach((docSnap) => {
                window.dbViews[docSnap.id] = docSnap.data().count || 0;
            });
            if (typeof window.applyViewsToPlaylist === 'function') {
                window.applyViewsToPlaylist();
            }
        } catch (e) {
            console.error("조회수 로드 실패:", e);
        }
    };

    window.incrementSongView = async function(songId, defaultViews = 0) {
        try {
            const viewRef = doc(db, "sheet_views", String(songId));
            if (window.dbViews[songId] === undefined && defaultViews > 0) {
                await setDoc(viewRef, { count: defaultViews + 1 }, { merge: true });
                window.dbViews[songId] = defaultViews + 1;
            } else {
                await setDoc(viewRef, { count: increment(1) }, { merge: true });
                window.dbViews[songId] = (window.dbViews[songId] || 0) + 1;
            }
            
            if (typeof window.applyViewsToPlaylist === 'function') {
                window.applyViewsToPlaylist();
            }
        } catch (e) {
            console.error("조회수 증가 실패:", e);
        }
    };

    window.loadFirebaseViews();

    function isSpamText(text) {
        const spamKeywords = ['http://', 'https://', 'www.', '카지노', '바카라', '대출', '토토', '성인'];
        const lowerText = text.toLowerCase();
        return spamKeywords.some(keyword => lowerText.includes(keyword));
    }

    window.autoResizeTextarea = function(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    };

    window.addComment = async function() {
        const nameInput = document.getElementById('c-name');
        const textInput = document.getElementById('c-text');
        
        const name = nameInput.value.trim();
        const text = textInput.value.trim();

        if (!name) {
            alert('성함이나 닉네임을 입력해 주세요^^');
            nameInput.focus();
            return;
        }

        if (!text) {
            alert('내용을 입력해 주세요^^');
            textInput.focus();
            return;
        }

        if (isSpamText(text) || isSpamText(name)) {
            alert('광고성 문구는 입력할 수 없습니다.');
            return;
        }

        try {
            if (editingCommentId) {
                const commentRef = doc(db, "sheet_comments", editingCommentId);
                await updateDoc(commentRef, {
                    name: name,
                    text: text,
                    isEdited: true
                });
                alert('댓글이 수정되었습니다!');
                cancelEditComment();
            } else {
                await addDoc(collection(db, "sheet_comments"), {
                    name: name,
                    text: text,
                    createdAt: new Date(),
                    dateStr: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    replies: []
                });
                textInput.value = '';
                textInput.style.height = '70px';
            }
        } catch (e) {
            console.error("댓글 실패:", e);
        }
    };

    window.startEditComment = function(commentId) {
        const item = commentsCache[commentId];
        if (!item) return;

        editingCommentId = commentId;
        const nameInput = document.getElementById('c-name');
        const textInput = document.getElementById('c-text');
        const submitBtn = document.getElementById('c-submit-btn');
        const cancelBtn = document.getElementById('c-cancel-btn');

        nameInput.value = item.name;
        textInput.value = item.text;
        autoResizeTextarea(textInput);

        submitBtn.innerText = "수정 완료";
        submitBtn.style.backgroundColor = "#72559c";
        cancelBtn.style.display = "inline-block";

        document.getElementById('main-comment-form').scrollIntoView({ behavior: 'smooth' });
    };

    window.cancelEditComment = function() {
        editingCommentId = null;
        const nameInput = document.getElementById('c-name');
        const textInput = document.getElementById('c-text');
        const submitBtn = document.getElementById('c-submit-btn');
        const cancelBtn = document.getElementById('c-cancel-btn');

        nameInput.value = '';
        textInput.value = '';
        textInput.style.height = '70px';

        submitBtn.innerText = "등록하기";
        submitBtn.style.backgroundColor = "#533e73";
        cancelBtn.style.display = "none";
    };

    window.deleteComment = async function(commentId, replyObject = null) {
        const inputPw = prompt('선생님 전용 비밀번호를 입력해 주세요:');
        if (inputPw !== ADMIN_PW) {
            alert('비밀번호가 올바르지 않습니다.');
            return;
        }

        try {
            if (replyObject) {
                const commentRef = doc(db, "sheet_comments", commentId);
                await updateDoc(commentRef, {
                    replies: arrayRemove(replyObject)
                });
            } else {
                await deleteDoc(doc(db, "sheet_comments", commentId));
            }
        } catch (e) {
            console.error("삭제 실패:", e);
        }
    };

    window.toggleReplyForm = function(commentId) {
        const form = document.getElementById(`reply-form-box-${commentId}`);
        if (form) form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    };

    window.addReply = async function(commentId) {
        const replyInput = document.getElementById(`reply-input-${commentId}`);
        const replyNameInput = document.getElementById(`reply-name-${commentId}`);
        const text = replyInput.value.trim();
        const name = replyNameInput.value.trim();

        if (!name || !text) return alert('성함과 답글 내용을 작성해 주세요.');

        try {
            const commentRef = doc(db, "sheet_comments", commentId);
            const replyData = {
                id: String(Date.now()),
                name: name,
                text: text,
                dateStr: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };
            await updateDoc(commentRef, {
                replies: arrayUnion(replyData)
            });
        } catch (e) {}
    };

    const q = query(collection(db, "sheet_comments"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        const box = document.getElementById('comment-list-box');
        if (snapshot.empty) {
            box.innerHTML = `<div style="text-align:center; padding:20px; color:#766391; font-size:13px;">아직 작성된 글이 없습니다. 편하게 이야기나 요청을 남겨보세요!</div>`;
            return;
        }

        box.innerHTML = '';
        commentsCache = {};

        snapshot.forEach((docSnap) => {
            const item = docSnap.data();
            const id = docSnap.id;
            commentsCache[id] = item;

            const div = document.createElement('div');
            div.className = 'comment-item';

            let repliesHtml = '';
            if (item.replies && item.replies.length > 0) {
                repliesHtml += `<div class="reply-list">`;
                item.replies.forEach(r => {
                    const rJson = JSON.stringify(r).replace(/"/g, '&quot;');
                    repliesHtml += `
                        <div class="reply-item" id="reply-item-${r.id}">
                            <div class="comment-author">
                                <span>↪ ${r.name} <span class="comment-date">${r.dateStr}</span></span>
                                <div>
                                    <button class="del-btn" onclick="deleteComment('${id}', ${rJson})">삭제</button>
                                </div>
                            </div>
                            <div class="comment-body">${r.text}</div>
                        </div>
                    `;
                });
                repliesHtml += `</div>`;
            }

            const editedTag = item.isEdited ? `<span style="font-size:10.5px; color:#72559c;"> (수정됨)</span>` : '';

            div.innerHTML = `
                <div class="comment-author">
                    <span>👤 ${item.name} <span class="comment-date">${item.dateStr}${editedTag}</span></span>
                    <div>
                        <button class="edit-btn" onclick="startEditComment('${id}')">수정</button>
                        <button class="del-btn" onclick="deleteComment('${id}')">삭제</button>
                    </div>
                </div>
                <div class="comment-body">${item.text}</div>
                
                <div class="action-btns">
                    <button class="reply-btn" onclick="toggleReplyForm('${id}')">답글 달기</button>
                </div>

                <div id="reply-form-box-${id}" class="reply-form" style="display:none;">
                    <div>
                        <input type="text" id="reply-name-${id}" class="comment-input-name" style="width:110px;" value="수하모">
                    </div>
                    <div>
                        <textarea id="reply-input-${id}" class="comment-input-textarea" style="min-height:50px;" placeholder="답글 작성..." oninput="autoResizeTextarea(this)"></textarea>
                    </div>
                    <button class="btn-submit-comment" style="padding:8px; font-size:13px;" onclick="addReply('${id}')">답글 등록</button>
                </div>
                ${repliesHtml}
            `;
            box.appendChild(div);
        });
    });
</script>

<script>
    const CLOUDFLARE_DOMAIN = "https://pub-3d4a1704561a4f5395902cf81530c3c0.r2.dev"; 

    let masterPlaylist = [];
    let currentMainFilter = '전체';
    let currentMoodFilter = '전체';
    let currentFilteredPlaylist = [];

    let currentPage = 1;
    let itemsPerPage = 30; 

    /* 슬라이드 큐 관련 상태 변수 */
    let slideQueue = []; // [{ song, imgUrl, pageNum, totalPages, imgIndex }]
    let currentQueueIndex = 0;

    const nowViewingTitle = document.getElementById('now-viewing-title');
    const pageIndicator = document.getElementById('page-indicator');
    const sheetPreviewImg = document.getElementById('sheet-preview-img');
    const noSheetMsg = document.getElementById('no-sheet-msg');
    const btnPrev = document.getElementById('btn-slide-prev');
    const btnNext = document.getElementById('btn-slide-next');

    window.onload = function() {
        loadSongs();
        initTouchEvents();
    };

    async function loadSongs() {
        try {
            let response = await fetch('sheets.json');
            if (!response.ok) {
                response = await fetch('/score/sheets.json');
            }
            
            const sampleMrData = await response.json();

            masterPlaylist = sampleMrData.map((item) => {
                // 단일 fileName 및 복수 images 호환 지원
                let imageList = [];
                if (item.images && Array.isArray(item.images) && item.images.length > 0) {
                    imageList = item.images.map(fn => `${CLOUDFLARE_DOMAIN}/sheet/${encodeURIComponent(fn)}`);
                } else if (item.fileName) {
                    imageList = [`${CLOUDFLARE_DOMAIN}/sheet/${encodeURIComponent(item.fileName)}`];
                }
                
                const initialViews = item.views !== undefined ? item.views : 0;
                const finalViews = window.dbViews[item.id] !== undefined ? window.dbViews[item.id] : initialViews;
                const divisionText = (item.division && item.division.trim() !== "") ? item.division.trim() : (item.type && item.type.trim() !== "") ? item.type.trim() : "-";
                const cleanMood = item.mood ? item.mood.replace(/[☕📻🎷]/g, '').trim() : '';

                return {
                    id: item.id,
                    mainCategory: item.cat,
                    mood: cleanMood,
                    title: item.title,
                    division: divisionText,
                    defaultViews: initialViews,
                    views: finalViews,
                    images: imageList
                };
            });

            applyFilters();
        } catch (error) {
            console.error("악보 데이터 로드 실패:", error);
        }
    }

    window.applyViewsToPlaylist = function() {
        if (!masterPlaylist) return;
        masterPlaylist.forEach(song => {
            if (window.dbViews[song.id] !== undefined) {
                song.views = window.dbViews[song.id];
            }
        });
        renderPlaylist();
    };

    function truncateTitle(title) {
        if (title && title.length > 12) {
            return title.substring(0, 12) + '...';
        }
        return title;
    }

    function changeItemsPerPage(val) {
        itemsPerPage = parseInt(val);
        currentPage = 1;
        renderPlaylist();
    }

    window.onresize = function() { renderPlaylist(); };

    function setMainCategory(categoryName, btn) {
        document.querySelectorAll('.btn-main').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentMainFilter = categoryName;
        currentPage = 1;
        applyFilters();
    }

    function setMoodCategory(moodName, btn) {
        document.querySelectorAll('.btn-sub').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentMoodFilter = moodName;
        currentPage = 1;
        applyFilters();
    }

    function applyFilters() {
        const chkAll = document.getElementById('chk-all');
        if (chkAll) chkAll.checked = false;

        const searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
        const divVal = document.getElementById('div-select').value;
        const sortVal = document.getElementById('sort-select').value;

        currentFilteredPlaylist = masterPlaylist.filter(song => {
            const matchMain = (currentMainFilter === '전체') || (song.mainCategory === currentMainFilter);
            const matchMood = (currentMoodFilter === '전체') || (song.mood === currentMoodFilter);
            const matchDiv = (divVal === '전체') || (song.division === divVal);
            const matchSearch = song.title.toLowerCase().includes(searchQuery) || song.division.toLowerCase().includes(searchQuery);
            return matchMain && matchMood && matchDiv && matchSearch;
        });

        currentFilteredPlaylist.sort((a, b) => {
            if (sortVal === 'latest') return Number(b.id) - Number(a.id);
            if (sortVal === 'name') return a.title.localeCompare(b.title, 'ko');
            if (sortVal === 'views') return b.views - a.views;
        });

        renderPlaylist();
    }

    let checkedSongIds = new Set();

    function updateCheckedSet() {
        document.querySelectorAll('.song-chk').forEach(chk => {
            const val = chk.value;
            if (chk.checked) checkedSongIds.add(val);
            else checkedSongIds.delete(val);
        });
    }

    function renderPlaylist() {
        updateCheckedSet();

        const tbody = document.getElementById('playlist-body');
        tbody.innerHTML = '';

        const totalItems = currentFilteredPlaylist.length;
        document.getElementById('total-count').innerText = `총 ${totalItems}악보`;

        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:#766391; font-size:14px;">등록된 악보가 없습니다.</td></tr>`;
            document.getElementById('pagination-box').innerHTML = '';
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
        const pageData = currentFilteredPlaylist.slice(startIndex, endIndex);

        pageData.forEach((song, index) => {
            const numStr = String(song.id).padStart(2, '0');
            const displayTitle = truncateTitle(song.title);
            const isChecked = checkedSongIds.has(String(song.id)) ? 'checked' : '';

            const tr = document.createElement('tr');
            tr.id = `row-${song.id}`;
            tr.innerHTML = `
                <td class="col-chk"><input type="checkbox" class="song-chk" value="${song.id}" ${isChecked} onchange="updateCheckedSet()"></td>
                <td class="col-num">${numStr}</td>
                <td class="col-cat"><span class="badge-main">${song.mainCategory}</span></td>
                <td class="col-title" title="${song.title}">${displayTitle}</td>
                <td class="col-division">${song.division}</td>
                <td class="col-views">${song.views}</td>
                <td class="col-action">
                    <button class="btn-play-single" onclick="playSingle('${song.id}')">보기</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPagination(totalItems);
    }

    function renderPagination(totalItems) {
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        const pageBox = document.getElementById('pagination-box');
        pageBox.innerHTML = '';

        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-btn';
        prevBtn.innerText = '◀';
        prevBtn.disabled = (currentPage === 1);
        prevBtn.onclick = () => { currentPage--; renderPlaylist(); };
        pageBox.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const numBtn = document.createElement('button');
            numBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            numBtn.innerText = i;
            numBtn.onclick = () => { currentPage = i; renderPlaylist(); };
            pageBox.appendChild(numBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-btn';
        nextBtn.innerText = '▶';
        nextBtn.disabled = (currentPage === totalPages);
        nextBtn.onclick = () => { currentPage++; renderPlaylist(); };
        pageBox.appendChild(nextBtn);
    }

    function toggleSelectAll() {
        const chks = document.querySelectorAll('.song-chk');
        const mainChk = document.getElementById('chk-all');
        let shouldSelectAll = false;
        chks.forEach(chk => { if (!chk.checked) shouldSelectAll = true; });
        if (mainChk) mainChk.checked = shouldSelectAll;
        chks.forEach(chk => {
            chk.checked = shouldSelectAll;
            if (shouldSelectAll) checkedSongIds.add(String(chk.value));
            else checkedSongIds.delete(String(chk.value));
        });
    }

    function toggleHeaderCheckbox() {
        const mainChk = document.getElementById('chk-all');
        const chks = document.querySelectorAll('.song-chk');
        const isChecked = mainChk.checked;
        chks.forEach(chk => {
            chk.checked = isChecked;
            if (isChecked) checkedSongIds.add(String(chk.value));
            else checkedSongIds.delete(String(chk.value));
        });
    }

    /* 단일 곡 선택 및 전체 곡 큐 생성 */
    function playSingle(id) {
        const targetIndex = currentFilteredPlaylist.findIndex(s => String(s.id) === String(id));
        if (targetIndex !== -1) {
            // 선택한 곡부터 그 이후의 모든 필터링된 곡을 큐로 설정
            buildSlideQueue(currentFilteredPlaylist.slice(targetIndex));
            renderSlide();
        }
    }

    /* 선택보기 및 전체보기 (체크된 모든 곡들을 순서대로 연속 큐 생성) */
    function viewSelected() {
        updateCheckedSet();
        if (checkedSongIds.size === 0) {
            alert('열람할 악보를 선택해 주세요.');
            return;
        }

        const selectedSongs = currentFilteredPlaylist.filter(song => checkedSongIds.has(String(song.id)));
        if (selectedSongs.length > 0) {
            buildSlideQueue(selectedSongs);
            renderSlide();
        }
    }

    /* 슬라이드할 이미지 목록(큐)을 페이지 단위로 쪼개어 구성 */
    function buildSlideQueue(songList) {
        slideQueue = [];
        songList.forEach(song => {
            const totalPages = song.images.length;
            song.images.forEach((imgUrl, imgIdx) => {
                slideQueue.push({
                    song: song,
                    imgUrl: imgUrl,
                    pageNum: imgIdx + 1,
                    totalPages: totalPages,
                    imgIndex: imgIdx
                });
            });
        });
        currentQueueIndex = 0;
    }

    /* 현재 큐 위치에 따라 뷰어 및 모달 화면 출력 */
    function renderSlide() {
        if (slideQueue.length === 0) return;

        const currentItem = slideQueue[currentQueueIndex];
        const song = currentItem.song;

        // 곡의 첫 페이지 접속 시에만 조회수 증가
        if (currentItem.pageNum === 1 && typeof window.incrementSongView === 'function') {
            window.incrementSongView(song.id, song.defaultViews);
        }

        // 테이블 선택 열 활성화 표시
        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const activeRow = document.getElementById('row-' + song.id);
        if (activeRow) activeRow.classList.add('active-row');

        nowViewingTitle.innerText = `🎼 [악보 열람] ${song.title}`;
        
        noSheetMsg.style.display = 'none';
        sheetPreviewImg.src = currentItem.imgUrl;
        sheetPreviewImg.style.display = 'block';

        // 페이지 인디케이터 표시
        if (currentItem.totalPages > 1) {
            pageIndicator.innerText = `${currentItem.pageNum} / ${currentItem.totalPages} 페이지`;
            pageIndicator.style.display = 'inline-block';
        } else {
            pageIndicator.style.display = 'none';
        }

        // 화살표 버튼 노출 조건
        btnPrev.style.display = (currentQueueIndex > 0) ? 'block' : 'none';
        btnNext.style.display = (currentQueueIndex < slideQueue.length - 1) ? 'block' : 'none';

        // 모달창이 열려있을 경우 모달도 동시 갱신
        const modal = document.getElementById('image-modal');
        if (modal.style.display === 'flex') {
            document.getElementById('modal-img').src = currentItem.imgUrl;
            const pageTxt = currentItem.totalPages > 1 ? ` (${currentItem.pageNum}/${currentItem.totalPages})` : '';
            document.getElementById('modal-info-text').innerText = `${song.title}${pageTxt}`;
        }

        document.querySelector('.viewer-section').scrollIntoView({ behavior: 'smooth' });
    }

    function nextSlide() {
        if (currentQueueIndex < slideQueue.length - 1) {
            currentQueueIndex++;
            renderSlide();
        }
    }

    function prevSlide() {
        if (currentQueueIndex > 0) {
            currentQueueIndex--;
            renderSlide();
        }
    }

    /* 터치 슬라이드(스와이프) 이벤트 구현 */
    function initTouchEvents() {
        const touchTargets = [document.getElementById('sheet-box'), document.getElementById('image-modal')];
        
        touchTargets.forEach(target => {
            let startX = 0;
            let startY = 0;

            target.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            target.addEventListener('touchend', (e) => {
                if (!startX || !startY) return;

                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;

                const diffX = startX - endX;
                const diffY = startY - endY;

                // 좌우 좌우 스와이프가 상하 스크롤보다 클 때 동작 (50px 이상 이동 시)
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        // 손가락을 왼쪽으로 슉 밀었을 때 ➔ 다음 악보/페이지
                        nextSlide();
                    } else {
                        // 손가락을 오른쪽으로 슉 밀었을 때 ➔ 이전 악보/페이지
                        prevSlide();
                    }
                }
                startX = 0;
                startY = 0;
            }, { passive: true });
        });
    }

    window.openModal = function() {
        if (slideQueue.length === 0) return;
        const modal = document.getElementById('image-modal');
        modal.style.display = "flex";
        renderSlide();
    };

    window.closeModal = function() {
        document.getElementById('image-modal').style.display = "none";
    };
</script>
