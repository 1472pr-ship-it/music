<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, arrayRemove, setDoc, increment, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAw8hem90scCf0X_NNpvQxXdaTy1XIiE84",
        authDomain: "suharmo.firebaseapp.com",
        projectId: "suharmo",
        storageBucket: "suharmo.firebasestorage.app",
        messagingSenderId: "479461638228",
        appId: "1:479461638228:web:0c6665c9aa659cc7d62dc1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_PW = "0906";

    let editingCommentId = null;
    let commentsCache = {};

    window.dbViews = {};

    window.loadFirebaseViews = async function() {
        try {
            const querySnapshot = await getDocs(collection(db, "user_song_views"));
            querySnapshot.forEach((docSnap) => {
                window.dbViews[docSnap.id] = docSnap.data().count || 0;
            });
            if (typeof window.applyViewsToPlaylist === 'function') {
                window.applyViewsToPlaylist();
            }
        } catch (e) {
            console.error("조회수 로드 실패:", e);
        }
    };

    window.incrementSongView = async function(songId, defaultViews = 0) {
        try {
            const viewRef = doc(db, "user_song_views", String(songId));
            if (window.dbViews[songId] === undefined && defaultViews > 0) {
                await setDoc(viewRef, { count: defaultViews + 1 }, { merge: true });
                window.dbViews[songId] = defaultViews + 1;
            } else {
                await setDoc(viewRef, { count: increment(1) }, { merge: true });
                window.dbViews[songId] = (window.dbViews[songId] || 0) + 1;
            }
            
            if (typeof window.applyViewsToPlaylist === 'function') {
                window.applyViewsToPlaylist();
            }
        } catch (e) {
            console.error("조회수 증가 실패:", e);
        }
    };

    window.loadFirebaseViews();

    function isSpamText(text) {
        const spamKeywords = ['http://', 'https://', 'www.', '카지노', '바카라', '대출', '토토', '성인'];
        const lowerText = text.toLowerCase();
        return spamKeywords.some(keyword => lowerText.includes(keyword));
    }

    window.autoResizeTextarea = function(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    };

    window.addComment = async function() {
        const nameInput = document.getElementById('c-name');
        const textInput = document.getElementById('c-text');
        
        const name = nameInput.value.trim();
        const text = textInput.value.trim();

        if (!name) {
            alert('성함이나 닉네임을 입력해 주세요^^');
            nameInput.focus();
            return;
        }

        if (!text) {
            alert('내용을 입력해 주세요^^');
            textInput.focus();
            return;
        }

        if (isSpamText(text) || isSpamText(name)) {
            alert('광고성 문구는 입력할 수 없습니다.');
            return;
        }

        try {
            if (editingCommentId) {
                const commentRef = doc(db, "user_comments", editingCommentId);
                await updateDoc(commentRef, {
                    name: name,
                    text: text,
                    isEdited: true
                });
                alert('댓글이 수정되었습니다!');
                cancelEditComment();
            } else {
                await addDoc(collection(db, "user_comments"), {
                    name: name,
                    text: text,
                    createdAt: new Date(),
                    dateStr: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    replies: []
                });
                textInput.value = '';
                textInput.style.height = '70px';
            }

    window.deleteComment = async function(commentId, replyObject = null) {
        const inputPw = prompt('선생님 전용 비밀번호를 입력해 주세요:');
        if (inputPw !== ADMIN_PW) {

        try {

    window.toggleReplyForm = function(commentId) {

            };
            
            await updateDoc(commentRef, {

    /* 🔥 답글(관리자) 수정 기능 지원 */
    window.startEditReply = function(commentId, replyId) {

        const replyObj = parentDoc.replies.find(r => String(r.id) === String(replyId));

    window.updateReply = async function(commentId, replyId) {

        } catch (e) {

    const q = query(collection(db, "user_comments"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {

                                <div>
                                    <input type="text" id="reply-edit-name-${r.id}" class="comment-input-name" style="width:110px;" value="${r.name}">
                                </div>
                                <div>
                                    <textarea id="reply-edit-input-${r.id}" class="comment-input-textarea" style="min-height:50px;" oninput="autoResizeTextarea(this)">${r.text}</textarea>

                                    <button class="btn-submit-comment" style="padding:6px; font-size:12.5px; background-color:#66756c;" onclick="cancelEditReply('${r.id}')">취소</button>

                repliesHtml += `</div>`;

            const editedTag = item.isEdited ? `<span style="font-size:10.5px; color:#4a7c60;"> (수정됨)</span>` : '';

            div.innerHTML = `
                <div class="comment-author">
                    <span>👤 ${item.name} <span class="comment-date">${item.dateStr}${editedTag}</span></span>
                    <div>
                        <button class="edit-btn" onclick="startEditComment('${id}')">수정</button>
                        <button class="del-btn" onclick="deleteComment('${id}')">삭제</button>

                </div>
                <div class="comment-body">${item.text}</div>
                
                <div class="action-btns">
                    <button class="reply-btn" onclick="toggleReplyForm('${id}')">답글 달기</button>
                </div>

                <div id="reply-form-box-${id}" class="reply-form" style="display:none;">
                    <div>
                        <input type="text" id="reply-name-${id}" class="comment-input-name" style="width:110px;" value="수하모">
                    </div>
                    <div>
                        <textarea id="reply-input-${id}" class="comment-input-textarea" style="min-height:50px;" placeholder="답글 작성..." oninput="autoResizeTextarea(this)"></textarea>
                    </div>
                    <button class="btn-submit-comment" style="padding:8px; font-size:13px;" onclick="addReply('${id}')">답글 등록</button>

                ${repliesHtml}

            box.appendChild(div);
        });
    });
</script>

<script>
    const CLOUDFLARE_DOMAIN = "https://pub-3d4a1704561a4f5395902cf81530c3c0.r2.dev"; 

    let masterPlaylist = [];

    // 닉네임 마스킹 헬퍼 (성덕윤 -> 성*윤, 애플 -> 애*플, 양산하모니카 -> 양*산)
    function maskName(nick) {
        if (!nick) return "";
        let cleanNick = nick.trim();
        if (cleanNick.length === 2) {
            return cleanNick[0] + '*' + cleanNick[1];
        } else if (cleanNick.length >= 3) {
            return cleanNick[0] + '*' + cleanNick[2];
        }
        return cleanNick;
    }

    // 원본 파일명을 '곡명_키_마스킹연주자'로 변환하는 파서 함수
    function processDisplayTitle(fullTitle) {
        if (!fullTitle) return fullTitle;

        let name = fullTitle.replace(/\.(mp3|m4a|wav)$/i, '').trim();

        if (name.includes('_') && !name.includes(' ')) {
            const parts = name.split('_');
            if (parts.length >= 2) {
                let nick = parts[1].trim();
                let maskedNick = maskName(nick);
                return `${parts[0]}_${maskedNick}`;
            }
        }

        let clean = name.replace(/\d{4}-\d{2}-\d{2}/g, '')
                        .replace(/[\d,]+년\s*[\d]*일/g, '')
                        .replace(/\d+개월\d*일차/g, '')
                        .replace(/반주|무반주/g, '')
                        .replace(/[_,]/g, ' ')
                        .replace(/\s+/g, ' ').trim();

        const tokens = clean.split(' ').filter(t => t.length > 0);
        if (tokens.length === 0) return fullTitle;

        let key = "";
        let keyIndex = -1;

        for (let i = 0; i < tokens.length; i++) {
            if (/^[A-G][b#]?[m]?$/i.test(tokens[i])) {
                key = tokens[i].toUpperCase();
                keyIndex = i;
                break;
            }
        }

        let songTitle = "";
        let artist = "";

        if (keyIndex !== -1) {
            songTitle = tokens.slice(0, keyIndex).join(' ');
            if (keyIndex + 1 < tokens.length) {
                artist = tokens[tokens.length - 1];
            }
        } else {
            songTitle = tokens[0];
            if (tokens.length > 1) {
                artist = tokens[tokens.length - 1];
            }
        }

        let maskedArtist = maskName(artist);

        if (songTitle && key && maskedArtist) {
            return `${songTitle}_${key}_${maskedArtist}`;
        } else if (songTitle && key) {
            return `${songTitle}_${key}`;
        } else if (songTitle && maskedArtist) {
            return `${songTitle}_${maskedArtist}`;
        }

        return fullTitle;
    }

    async function loadSongs() {
        try {
            let response = await fetch('songs.json');
            if (!response.ok) {
                response = await fetch('/user/songs.json');
            }
            
            const sampleData = await response.json();

            masterPlaylist = sampleData.map((item) => {
                let streamUrl = `${CLOUDFLARE_DOMAIN}/user/${encodeURIComponent(item.fileName)}`;
                
                const initialViews = item.views !== undefined ? item.views : 0;
                const finalViews = window.dbViews[item.id] !== undefined ? window.dbViews[item.id] : initialViews;

                const divisionText = (item.division && item.division.trim() !== "") ? item.division.trim() : (item.type && item.type.trim() !== "") ? item.type.trim() : "-";

                // JSON의 title에 이미 마스킹이 적용된 경우 그대로 출력하도록 처리
                let displayTitleText = item.title;
                if (item.title && !item.title.includes('*') && item.title.includes(' ')) {
                    displayTitleText = processDisplayTitle(item.title);
                }

                const techText = (item.mood && item.mood.trim() !== "") ? item.mood.trim() : (item.cat && item.cat.trim() !== "") ? item.cat.trim() : "기타";
                const yearText = (item.cat && item.cat.trim() !== "") ? item.cat.trim() : "전체";

                return {
                    id: item.id,
                    mainCategory: techText,     
                    mood: yearText,             
                    rawTitle: item.title,       
                    title: displayTitleText,    
                    division: divisionText,
                    defaultViews: initialViews,
                    views: finalViews,
                    src: streamUrl
                };
            });

            applyFilters();
        } catch (error) {
            console.error("자람실 음원 데이터 로드 실패:", error);
        }
    }

    window.applyViewsToPlaylist = function() {
        if (!masterPlaylist) return;
        masterPlaylist.forEach(song => {
            if (window.dbViews[song.id] !== undefined) {
                song.views = window.dbViews[song.id];
            }
        });
        renderPlaylist();
    };

    let currentMainFilter = '전체';
    let currentMoodFilter = '전체';
    let currentFilteredPlaylist = [];

    let currentPage = 1;
    let itemsPerPage = 30; 

    let playlistQueue = [];
    let currentQueueIndex = 0;
    let loopMode = 'ALL';

    const audioPlayer = document.getElementById('audio-player');
    const nowPlayingTitle = document.getElementById('now-playing-title');

    audioPlayer.addEventListener('play', () => {
        nowPlayingTitle.classList.add('playing');
    });
    audioPlayer.addEventListener('playing', () => {
        nowPlayingTitle.classList.add('playing');
    });
    audioPlayer.addEventListener('pause', () => {
        nowPlayingTitle.classList.remove('playing');
    });
    audioPlayer.addEventListener('ended', () => {
        nowPlayingTitle.classList.remove('playing');
    });

    window.onload = function() {
        loadSongs();
    };

    /* 🔥 곡명을 16자로 조절하여 번호와 구분 칸이 깔끔히 보이도록 지정 */
    function truncateTitle(title) {
        if (title && title.length > 16) {
            return title.substring(0, 16) + '...';
        }
        return title;
    }

    function changeItemsPerPage(val) {
        itemsPerPage = parseInt(val);
        currentPage = 1;
        renderPlaylist();
    }

    window.onresize = function() { renderPlaylist(); };

    function setMainCategory(categoryName, btn) {
        document.querySelectorAll('.btn-main').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentMainFilter = categoryName;
        currentPage = 1;
        applyFilters();
    }

    function setMoodCategory(moodName, btn) {
        document.querySelectorAll('.btn-sub').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentMoodFilter = moodName;
        currentPage = 1;
        applyFilters();
    }

    function applyFilters() {
        const chkAll = document.getElementById('chk-all');
        if (chkAll) chkAll.checked = false;

        const searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
        const divVal = document.getElementById('div-select').value;
        const sortVal = document.getElementById('sort-select').value;

        currentFilteredPlaylist = masterPlaylist.filter(song => {
            const matchYear = (currentMainFilter === '전체') || (song.mood === currentMainFilter) || (song.mainCategory === currentMainFilter);
            const matchTech = (currentMoodFilter === '전체') || (song.mainCategory === currentMoodFilter) || (song.mood === currentMoodFilter);
            const matchDiv = (divVal === '전체') || (song.division.includes(divVal));
            const matchSearch = song.title.toLowerCase().includes(searchQuery) || song.rawTitle.toLowerCase().includes(searchQuery) || song.division.toLowerCase().includes(searchQuery);
            return matchYear && matchTech && matchDiv && matchSearch;
        });

        currentFilteredPlaylist.sort((a, b) => {
            if (sortVal === 'latest') return Number(b.id) - Number(a.id);
            if (sortVal === 'name') return a.title.localeCompare(b.title, 'ko');
            if (sortVal === 'views') return b.views - a.views;
        });

        renderPlaylist();
    }

    let checkedSongIds = new Set();

    function updateCheckedSet() {
        document.querySelectorAll('.song-chk').forEach(chk => {
            const val = chk.value;
            if (chk.checked) checkedSongIds.add(val);
            else checkedSongIds.delete(val);
        });
    }

    function renderPlaylist() {
        updateCheckedSet();

        const tbody = document.getElementById('playlist-body');
        tbody.innerHTML = '';

        const totalItems = currentFilteredPlaylist.length;
        document.getElementById('total-count').innerText = `총 ${totalItems}곡`;

        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:#66756c; font-size:14px;">등록된 수강생 연주 음원이 없습니다.</td></tr>`;
            document.getElementById('pagination-box').innerHTML = '';
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
        const pageData = currentFilteredPlaylist.slice(startIndex, endIndex);

        pageData.forEach((song, index) => {
            /* 🔥 번호 천단위 4자리 확보를 위해 String(song.id) 변환 */
            const numStr = String(song.id);
            const displayTitle = truncateTitle(song.title);
            const isChecked = checkedSongIds.has(String(song.id)) ? 'checked' : '';

            const tr = document.createElement('tr');
            tr.id = `row-${song.id}`;
            tr.innerHTML = `
                <td class="col-chk"><input type="checkbox" class="song-chk" value="${song.id}" ${isChecked} onchange="updateCheckedSet()"></td>
                <td class="col-num">${numStr}</td>
                <td class="col-cat"><span class="badge-main">${song.mainCategory}</span></td>
                <td class="col-title" title="${song.title}">${displayTitle}</td>
                <td class="col-division">${song.division}</td>
                <td class="col-views">${song.views}</td>
                <td class="col-action">
                    <button class="btn-play-single" onclick="playSingle('${song.id}')">듣기</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPagination(totalItems);
    }

    /* 🔥 하단 페이징 5개 고정 & ◀ ▶ 고정 알고리즘 구현 */
    function renderPagination(totalItems) {
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        const pageBox = document.getElementById('pagination-box');
        pageBox.innerHTML = '';

        if (totalPages <= 1) return;

        const maxButtons = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
        let endPage = startPage + maxButtons - 1;

        if (endPage > totalPages) {
            endPage = totalPages;
            startPage = Math.max(1, endPage - maxButtons + 1);
        }

        // 이전(◀) 버튼
        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-btn';
        prevBtn.innerText = '◀';
        prevBtn.disabled = (currentPage === 1);
        prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderPlaylist(); } };
        pageBox.appendChild(prevBtn);

        // 5개 고정 페이지 버튼
        for (let i = startPage; i <= endPage; i++) {
            const numBtn = document.createElement('button');
            numBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            numBtn.innerText = i;
            numBtn.onclick = () => { currentPage = i; renderPlaylist(); };
            pageBox.appendChild(numBtn);
        }

        // 다음(▶) 버튼
        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-btn';
        nextBtn.innerText = '▶';
        nextBtn.disabled = (currentPage === totalPages);
        nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderPlaylist(); } };
        pageBox.appendChild(nextBtn);
    }

    function toggleSelectAll() {
        const chks = document.querySelectorAll('.song-chk');
        const mainChk = document.getElementById('chk-all');
        let shouldSelectAll = false;
        chks.forEach(chk => { if (!chk.checked) shouldSelectAll = true; });
        if (mainChk) mainChk.checked = shouldSelectAll;
        chks.forEach(chk => {
            chk.checked = shouldSelectAll;
            if (shouldSelectAll) checkedSongIds.add(String(chk.value));
            else checkedSongIds.delete(String(chk.value));
        });
    }

    function toggleHeaderCheckbox() {
        const mainChk = document.getElementById('chk-all');
        const chks = document.querySelectorAll('.song-chk');
        const isChecked = mainChk.checked;
        chks.forEach(chk => {
            chk.checked = isChecked;
            if (isChecked) checkedSongIds.add(String(chk.value));
            else checkedSongIds.delete(String(chk.value));
        });
    }

    function playSingle(id) {
        const songIndex = currentFilteredPlaylist.findIndex(s => String(s.id) === String(id));
        if (songIndex !== -1) {
            playlistQueue = currentFilteredPlaylist.slice(songIndex);
            currentQueueIndex = 0;
            startPlayback();
        }
    }

    function playSelected() {
        updateCheckedSet();
        if (checkedSongIds.size === 0) {
            alert('재생할 곡을 선택해 주세요.');
            return;
        }

        playlistQueue = [];
        masterPlaylist.forEach(song => {
            if (checkedSongIds.has(String(song.id))) playlistQueue.push(song);
        });

        currentQueueIndex = 0;
        startPlayback();
    }

    function toggleLoopMode() {
        const btn = document.getElementById('btn-loop-toggle');
        if (loopMode === 'ALL') {
            loopMode = 'ONE';
            btn.innerText = "🔂 한곡반복";
        } else {
            loopMode = 'ALL';
            btn.innerText = "🔁 전체반복";
        }
    }

    function startPlayback() {
        if (playlistQueue.length === 0 || currentQueueIndex >= playlistQueue.length) return;

        const song = playlistQueue[currentQueueIndex];

        // 재생 시 조회수 상승 처리
        if (typeof window.incrementSongView === 'function') {
            window.incrementSongView(song.id, song.defaultViews);
        }

        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const activeRow = document.getElementById('row-' + song.id);
        if (activeRow) activeRow.classList.add('active-row');

        const titleText = (loopMode === 'ONE') 
            ? `🔂 [1곡 무한반복] ${song.title}`
            : `▶️ [재생 중 ${currentQueueIndex + 1}/${playlistQueue.length}] ${song.title}`;

        nowPlayingTitle.innerText = titleText;
        document.title = `${song.title} - 수강생 연주 자람실`;

        audioPlayer.src = song.src;
        /* 🔥 requestWakeLock() 비활성화: 음원 재생 중에도 화면이 자동 절전 꺼짐되도록 유지 */
        audioPlayer.play().then(() => {
            nowPlayingTitle.classList.add('playing');

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: `수강생 연주 자람실`,
                    album: "수하모니카",
                    artwork: [{ src: 'https://raw.githubusercontent.com/1472pr-ship-it/music/main/icon.png', sizes: '512x512', type: 'image/png' }]
                });
            }
        }).catch(e => {});
    }

    audioPlayer.onended = function() {
        if (loopMode === 'ONE') {
            startPlayback();
        } else {
            currentQueueIndex++;
            if (currentQueueIndex >= playlistQueue.length) currentQueueIndex = 0; 
            startPlayback();
        }
    };

    audioPlayer.onerror = function() {
        setTimeout(() => {
            if (playlistQueue.length > 0) startPlayback();
        }, 1000);
    };
</script>

</body>
</html>
