<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- PWA 웹앱 설정 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/1472pr-ship-it/music/main/icon.png">
    <link rel="icon" href="https://raw.githubusercontent.com/1472pr-ship-it/music/main/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5c2028">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>수하모니카</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #ffffff; color: #332d29; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #5c2028, #8b3a42); color: #ffffff; padding: 10px 14px; text-align: center; }
        .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: #fcf8f2; }

        /* Filter Section */
        .filter-section { background-color: #f5efe6; border-bottom: 1px solid #e5dccf; padding: 5px 8px; display: flex; flex-direction: column; gap: 4px; }
        .filter-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; width: 100%; }
        .filter-label { font-size: 11px; font-weight: bold; color: #4a382c; min-width: 50px; background: #e6dacb; padding: 3px 4px; border-radius: 4px; text-align: center; flex-shrink: 0; white-space: nowrap; }
        .filter-buttons { display: flex; gap: 3px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 1px; flex-grow: 1; }
        .filter-buttons::-webkit-scrollbar { display: none; }
        .btn-filter { padding: 3px 6px; font-size: 11.5px; font-weight: 600; color: #54473e; background: #ffffff; border: 1px solid #d9ccbc; border-radius: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .btn-filter.active { background-color: #8b3a42; color: #ffffff; border-color: #8b3a42; }
        .btn-filter-sub.active { background-color: #8c6d3f; color: #ffffff; border-color: #8c6d3f; }

        /* Player Section */
        .player-section { background: #f0e6df; border-bottom: 2px solid #8b3a42; color: #4a2c2a; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
        .now-playing { font-size: 13.5px; font-weight: bold; color: #8b3a42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        audio { width: 100%; height: 38px; outline: none; border-radius: 6px; }
        .bg-notice { font-size: 11px; color: #7a6058; letter-spacing: -0.3px; margin-top: 1px; }

        /* Control Bar */
        .control-bar { background-color: #fcf9f5; border-bottom: 1px solid #eee5da; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; }
        .btn-group { display: flex; gap: 6px; }
        .btn { background-color: #ffffff; border: 1px solid #d1c2b1; color: #4a3d34; padding: 5px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background-color: #8b3a42; color: #ffffff; border-color: #8b3a42; }

        /* Table Area */
        .table-responsive { width: 100%; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 14.5px; text-align: left; table-layout: fixed; }
        thead { background-color: #f2e9de; border-bottom: 2px solid #8b3a42; }
        th, td { padding: 7px 4px; border-bottom: 1px solid #ede3d8; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        th { color: #4a3a2f; font-weight: 700; font-size: 13.5px; }
        tr:hover { background-color: #faf5ef; }
        tr.active-row { background-color: #f7ede2; }
        
        .col-chk { width: 30px; text-align: center; }
        .col-chk input { transform: scale(1.15); }
        .col-num { width: 28px; text-align: center; color: #8c7b6e; font-size: 12.5px; }
        .col-cat { width: 62px; text-align: center; }
        .col-title { font-weight: 700; color: #2e2621; font-size: 14.5px; }
        .col-period { width: 68px; text-align: center; font-size: 12px; color: #8c6d3f; font-weight: 600; display: table-cell; }
        .col-artist { width: 58px; color: #59493e; text-align: center; font-size: 13px; display: table-cell; }
        .col-views { width: 45px; color: #78675a; text-align: center; font-size: 11.5px; display: table-cell; }
        .col-action { width: 45px; text-align: center; }

        @media (max-width: 600px) {
            .col-views, .col-artist { display: none; }
            .col-period { display: table-cell; width: 65px; }
            .col-cat { width: 58px; }
            .header h1 { font-size: 17px; }
            th, td { padding: 6px 3px; }
        }

        .badge-main { display: inline-block; padding: 2px 4px; border-radius: 3px; font-size: 10.5px; background-color: #ebdcd0; color: #4a3427; font-weight: bold; }
        .btn-play-single { padding: 4px 8px; font-size: 12px; background-color: #f2e7dc; border: 1px solid #d1bfac; border-radius: 4px; cursor: pointer; color: #3b2f27; font-weight: bold; }

        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px; background-color: #fbf6ef; border-top: 2px solid #8b3a42; }
        .page-btn { padding: 6px 14px; font-size: 14px; font-weight: bold; color: #54473e; background: #ffffff; border: 1px solid #d1c2b1; border-radius: 5px; cursor: pointer; }
        .page-btn.active { background-color: #8b3a42; color: #ffffff; border-color: #8b3a42; }

        /* --- [스팸 방지 & 댓글 게시판 스타일] --- */
        .comment-section { background-color: #fcfbf9; border-top: 3px solid #8b3a42; padding: 16px 12px; margin-top: 10px; }
        .comment-header { font-size: 15px; font-weight: bold; color: #5c2028; margin-bottom: 12px; }
        .comment-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; background: #fff; padding: 12px; border: 1px solid #e5dccf; border-radius: 6px; }
        .comment-input-group { display: flex; gap: 8px; }
        .comment-input-name { width: 120px; padding: 8px; font-size: 13px; border: 1px solid #d1c2b1; border-radius: 4px; }
        .comment-input-text { flex: 1; padding: 8px; font-size: 13px; border: 1px solid #d1c2b1; border-radius: 4px; }
        .btn-submit-comment { padding: 8px 16px; background-color: #8b3a42; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .comment-list { display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: #ffffff; border: 1px solid #eee5da; border-radius: 6px; padding: 10px 12px; }
        .comment-author { font-size: 13px; font-weight: bold; color: #5c2028; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .comment-date { font-size: 11px; color: #8c7b6e; font-weight: normal; margin-left: 6px; }
        .comment-body { font-size: 13.5px; color: #332d29; line-height: 1.4; word-break: break-all; }
        .action-btns { display: flex; gap: 8px; margin-top: 6px; }
        .reply-btn, .del-btn { font-size: 11px; background: none; border: none; cursor: pointer; text-decoration: underline; font-weight: bold; }
        .reply-btn { color: #8c6d3f; }
        .del-btn { color: #b33939; }
        .reply-list { margin-top: 8px; padding-left: 14px; border-left: 2px solid #ebdcd0; display: flex; flex-direction: column; gap: 6px; }
        .reply-item { background: #faf5ef; padding: 6px 10px; border-radius: 4px; }
        .reply-form { margin-top: 8px; display: flex; gap: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>평생 곁을 지켜줄 가장 따뜻한 친구, 하모니카</h1>
    </div>

    <div class="filter-section">
        <div class="filter-row">
            <span class="filter-label">🎼 장르</span>
            <div class="filter-buttons">
                <button class="btn-filter btn-main active" onclick="setMainCategory('전체', this)">전체</button>
                <button class="btn-filter btn-main" onclick="setMainCategory('가요/트롯', this)">가요/트롯</button>
                <button class="btn-filter btn-main" onclick="setMainCategory('동요/가곡', this)">동요/가곡</button>
                <button class="btn-filter btn-main" onclick="setMainCategory('팝/외국곡', this)">팝/외국곡</button>
                <button class="btn-filter btn-main" onclick="setMainCategory('클래식', this)">클래식</button>
            </div>
        </div>
        <div class="filter-row">
            <span class="filter-label">🎶 분위기</span>
            <div class="filter-buttons">
                <button class="btn-filter btn-filter-sub btn-sub active" onclick="setMoodCategory('전체', this)">전체</button>
                <button class="btn-filter btn-filter-sub btn-sub" onclick="setMoodCategory('서정/슬로우', this)">☕ 서정/슬로우</button>
                <button class="btn-filter btn-filter-sub btn-sub" onclick="setMoodCategory('정통트롯', this)">📻 정통트롯</button>
                <button class="btn-filter btn-filter-sub btn-sub" onclick="setMoodCategory('경쾌한', this)">🎷 경쾌한</button>
            </div>
        </div>
    </div>

    <div class="player-section">
        <div class="now-playing" id="now-playing-title">🎵 [재생] 곡을 선택하거나 [듣기]를 누르세요</div>
        <audio id="audio-player" controls controlsList="nodownload" oncontextmenu="return false;" autoplay></audio>
        <div class="bg-notice">💡 화면이 꺼진 후 음악이 멈추면 스마트폰 [배터리 절전 모드]를 해제해 주세요.</div>
    </div>

    <div class="control-bar">
        <div class="btn-group">
            <button class="btn" onclick="toggleSelectAll()">전체선택</button>
            <button class="btn btn-primary" onclick="playSelected()">선택듣기</button>
        </div>
        <div style="font-size: 13px; color: #78675a; font-weight: bold;" id="total-count">
            총 0곡
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="col-chk"><input type="checkbox" id="chk-all" onclick="toggleHeaderCheckbox()"></th>
                    <th class="col-num">No</th>
                    <th class="col-cat">장르</th>
                    <th class="col-title">연주곡명</th>
                    <th class="col-period">입문기간</th>
                    <th class="col-artist">연주자</th>
                    <th class="col-views">조회</th>
                    <th class="col-action">듣기</th>
                </tr>
            </thead>
            <tbody id="playlist-body">
            </tbody>
        </table>
    </div>

    <div class="pagination-container" id="pagination-box">
    </div>

    <!-- --- [간편 한줄 감상평 / 댓글 작성 영역] --- -->
    <div class="comment-section">
        <div class="comment-header">💬 연주 감상 한줄평 & 응원 한마디</div>
        
        <div class="comment-form">
            <div class="comment-input-group">
                <input type="text" id="c-name" class="comment-input-name" placeholder="성함 / 닉네임" maxlength="10">
                <input type="text" id="c-text" class="comment-input-text" placeholder="감상평이나 응원글을 작성해 주세요^^" onkeypress="if(event.key==='Enter') addComment();">
                <button class="btn-submit-comment" onclick="addComment()">등록</button>
            </div>
        </div>

        <div class="comment-list" id="comment-list-box">
            <!-- 댓글 목록 영역 -->
        </div>
    </div>
</div>

<script>
    const GH_USER = "1472pr-ship-it";
    const GH_REPO = "music";
    const ADMIN_PW = "1472"; // 선생님 전용 삭제 비밀번호

    let masterPlaylist = [];
    let wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    async function loadSongs() {
        try {
            const response = await fetch('songs.json');
            const songData = await response.json();
            
            masterPlaylist = songData.map((item) => {
                let streamUrl = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${encodeURIComponent(item.fileName)}`;
                return {
                    id: item.id,
                    mainCategory: item.cat,
                    mood: item.mood,
                    title: item.title,
                    period: item.period || "-",
                    artist: "수하모",
                    views: 0,
                    src: streamUrl
                };
            });

            applyFilters();
        } catch (error) {
            console.error("songs.json 로드 실패:", error);
        }
    }

    let currentMainFilter = '전체';
    let currentMoodFilter = '전체';
    let currentFilteredPlaylist = [];

    let currentPage = 1;
    const itemsPerPage = 30; 

    let playlistQueue = [];
    let currentQueueIndex = 0;
    let isRepeatSingleMode = false;

    const audioPlayer = document.getElementById('audio-player');
    const nowPlayingTitle = document.getElementById('now-playing-title');

    window.onload = function() {
        loadSongs();
        renderComments();
    };

    function truncateTitle(title) {
        const isMobile = window.innerWidth <= 600;
        if (isMobile && title.length > 12) {
            return title.substring(0, 12) + '...';
        }
        return title;
    }

    window.onresize = function() { renderPlaylist(); };

    function setMainCategory(categoryName, btn) {
        document.querySelectorAll('.btn-main').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentMainFilter = categoryName;
        currentPage = 1;
        applyFilters();
    }

    function setMoodCategory(moodName, btn) {
        document.querySelectorAll('.btn-sub').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentMoodFilter = moodName;
        currentPage = 1;
        applyFilters();
    }

    function applyFilters() {
        const chkAll = document.getElementById('chk-all');
        if (chkAll) chkAll.checked = false;

        currentFilteredPlaylist = masterPlaylist.filter(song => {
            const matchMain = (currentMainFilter === '전체') || (song.mainCategory === currentMainFilter);
            const matchMood = (currentMoodFilter === '전체') || (song.mood === currentMoodFilter);
            return matchMain && matchMood;
        });

        renderPlaylist();
    }

    let checkedSongIds = new Set();

    function updateCheckedSet() {
        document.querySelectorAll('.song-chk').forEach(chk => {
            const val = parseInt(chk.value);
            if (chk.checked) checkedSongIds.add(val);
            else checkedSongIds.delete(val);
        });
    }

    function renderPlaylist() {
        updateCheckedSet();

        const tbody = document.getElementById('playlist-body');
        tbody.innerHTML = '';

        const totalItems = currentFilteredPlaylist.length;
        document.getElementById('total-count').innerText = `총 ${totalItems}곡`;

        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:20px; color:#78675a; font-size:14px;">곡이 없습니다.</td></tr>`;
            document.getElementById('pagination-box').innerHTML = '';
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
        const pageData = currentFilteredPlaylist.slice(startIndex, endIndex);

        pageData.forEach((song, index) => {
            const displayNum = totalItems - (startIndex + index);
            const numStr = String(displayNum).padStart(2, '0');
            const displayTitle = truncateTitle(song.title);
            const isChecked = checkedSongIds.has(song.id) ? 'checked' : '';

            const tr = document.createElement('tr');
            tr.id = `row-${song.id}`;
            tr.innerHTML = `
                <td class="col-chk"><input type="checkbox" class="song-chk" value="${song.id}" ${isChecked} onchange="updateCheckedSet()"></td>
                <td class="col-num">${numStr}</td>
                <td class="col-cat"><span class="badge-main">${song.mainCategory}</span></td>
                <td class="col-title" title="${song.title}">${displayTitle}</td>
                <td class="col-period">${song.period}</td>
                <td class="col-artist">${song.artist}</td>
                <td class="col-views">${song.views}</td>
                <td class="col-action">
                    <button class="btn-play-single" onclick="playSingle(${song.id})">듣기</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPagination(totalItems);
    }

    function renderPagination(totalItems) {
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        const pageBox = document.getElementById('pagination-box');
        pageBox.innerHTML = '';

        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-btn';
        prevBtn.innerText = '◀';
        prevBtn.disabled = (currentPage === 1);
        prevBtn.onclick = () => { currentPage--; renderPlaylist(); };
        pageBox.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const numBtn = document.createElement('button');
            numBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            numBtn.innerText = i;
            numBtn.onclick = () => { currentPage = i; renderPlaylist(); };
            pageBox.appendChild(numBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-btn';
        nextBtn.innerText = '▶';
        nextBtn.disabled = (currentPage === totalPages);
        nextBtn.onclick = () => { currentPage++; renderPlaylist(); };
        pageBox.appendChild(nextBtn);
    }

    function toggleSelectAll() {
        const chks = document.querySelectorAll('.song-chk');
        const mainChk = document.getElementById('chk-all');
        let shouldSelectAll = false;
        chks.forEach(chk => { if (!chk.checked) shouldSelectAll = true; });
        if (mainChk) mainChk.checked = shouldSelectAll;
        chks.forEach(chk => {
            chk.checked = shouldSelectAll;
            const val = parseInt(chk.value);
            if (shouldSelectAll) checkedSongIds.add(val);
            else checkedSongIds.delete(val);
        });
    }

    function toggleHeaderCheckbox() {
        const mainChk = document.getElementById('chk-all');
        const chks = document.querySelectorAll('.song-chk');
        const isChecked = mainChk.checked;
        chks.forEach(chk => {
            chk.checked = isChecked;
            const val = parseInt(chk.value);
            if (isChecked) checkedSongIds.add(val);
            else checkedSongIds.delete(val);
        });
    }

    function playSingle(id) {
        const songIndex = currentFilteredPlaylist.findIndex(s => s.id === id);
        if (songIndex !== -1) {
            isRepeatSingleMode = false;
            playlistQueue = currentFilteredPlaylist.slice(songIndex);
            currentQueueIndex = 0;
            startPlayback();
        }
    }

    function playSelected() {
        updateCheckedSet();
        if (checkedSongIds.size === 0) {
            alert('재생할 곡을 선택해 주세요.');
            return;
        }

        playlistQueue = [];
        masterPlaylist.forEach(song => {
            if (checkedSongIds.has(song.id)) playlistQueue.push(song);
        });

        isRepeatSingleMode = (playlistQueue.length === 1);
        currentQueueIndex = 0;
        startPlayback();
    }

    function startPlayback() {
        if (playlistQueue.length === 0 || currentQueueIndex >= playlistQueue.length) return;

        const song = playlistQueue[currentQueueIndex];
        song.views++;
        renderPlaylist();

        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const activeRow = document.getElementById('row-' + song.id);
        if (activeRow) activeRow.classList.add('active-row');

        if (isRepeatSingleMode) {
            nowPlayingTitle.innerText = `🔂 [1곡 무한반복] ${song.title} - ${song.artist}`;
        } else {
            nowPlayingTitle.innerText = `▶️ [재생 중 ${currentQueueIndex + 1}/${playlistQueue.length}] ${song.title} - ${song.artist}`;
        }

        audioPlayer.src = song.src;
        audioPlayer.play().then(() => {
            requestWakeLock();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: "수하모니카 연주 감상실",
                    artwork: [{ src: 'https://raw.githubusercontent.com/1472pr-ship-it/music/main/icon.png', sizes: '512x512', type: 'image/png' }]
                });
                navigator.mediaSession.setActionHandler('play', () => { audioPlayer.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { audioPlayer.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    if (currentQueueIndex > 0) { currentQueueIndex--; startPlayback(); }
                });
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    currentQueueIndex++;
                    if (currentQueueIndex >= playlistQueue.length) currentQueueIndex = 0;
                    startPlayback();
                });
            }
        }).catch(e => {});
    }

    audioPlayer.onended = function() {
        if (isRepeatSingleMode) {
            startPlayback();
        } else {
            currentQueueIndex++;
            if (currentQueueIndex >= playlistQueue.length) currentQueueIndex = 0; 
            startPlayback();
        }
    };

    // --- [스팸 방지 & 댓글 관리 로직] ---
    function getStoredComments() {
        const data = localStorage.getItem('su_harmonica_comments');
        return data ? JSON.parse(data) : [];
    }

    function saveStoredComments(comments) {
        localStorage.setItem('su_harmonica_comments', JSON.stringify(comments));
    }

    // 스팸 및 인터넷 주소 필터링 함수
    function isSpamText(text) {
        const spamKeywords = ['http://', 'https://', 'www.', '카지노', '바카라', '대출', '토토', '성인'];
        const lowerText = text.toLowerCase();
        return spamKeywords.some(keyword => lowerText.includes(keyword));
    }

    function addComment() {
        const nameInput = document.getElementById('c-name');
        const textInput = document.getElementById('c-text');
        const name = nameInput.value.trim() || '수강생';
        const text = textInput.value.trim();

        if (!text) {
            alert('감상평 내용을 입력해 주세요^^');
            return;
        }

        if (isSpamText(text) || isSpamText(name)) {
            alert('광고성 문구나 인터넷 주소(링크)는 입력할 수 없습니다.');
            return;
        }

        const comments = getStoredComments();
        const newComment = {
            id: Date.now(),
            name: name,
            text: text,
            date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
            replies: []
        };

        comments.unshift(newComment); // 최신글이 최상단에 올 배치
        saveStoredComments(comments);

        textInput.value = '';
        renderComments();
    }

    function addReply(commentId) {
        const replyInput = document.getElementById(`reply-input-${commentId}`);
        const replyNameInput = document.getElementById(`reply-name-${commentId}`);
        const text = replyInput.value.trim();
        const name = replyNameInput.value.trim() || '선생님';

        if (!text) return;

        if (isSpamText(text) || isSpamText(name)) {
            alert('광고성 문구는 입력할 수 없습니다.');
            return;
        }

        const comments = getStoredComments();
        const parent = comments.find(c => c.id === commentId);
        if (parent) {
            parent.replies.push({
                id: Date.now(),
                name: name,
                text: text,
                date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            });
            saveStoredComments(comments);
            renderComments();
        }
    }

    // 선생님 전용 댓글 삭제 함수
    function deleteComment(commentId, replyId = null) {
        const inputPw = prompt('선생님 전용 비밀번호를 입력해 주세요:');
        if (inputPw !== ADMIN_PW) {
            alert('비밀번호가 올바르지 않습니다.');
            return;
        }

        let comments = getStoredComments();

        if (replyId) {
            // 답글 삭제
            const parent = comments.find(c => c.id === commentId);
            if (parent) {
                parent.replies = parent.replies.filter(r => r.id !== replyId);
            }
        } else {
            // 메인 댓글 삭제
            comments = comments.filter(c => c.id === commentId);
        }

        saveStoredComments(comments);
        renderComments();
    }

    function toggleReplyForm(commentId) {
        const form = document.getElementById(`reply-form-box-${commentId}`);
        if (form) form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    }

    function renderComments() {
        const box = document.getElementById('comment-list-box');
        const comments = getStoredComments();

        if (comments.length === 0) {
            box.innerHTML = `<div style="text-align:center; padding:20px; color:#8c7b6e; font-size:13px;">아직 작성된 감상평이 없습니다. 첫 소감을 남겨보세요!</div>`;
            return;
        }

        box.innerHTML = '';
        comments.forEach(item => {
            const div = document.createElement('div');
            div.className = 'comment-item';

            let repliesHtml = '';
            if (item.replies && item.replies.length > 0) {
                repliesHtml += `<div class="reply-list">`;
                item.replies.forEach(r => {
                    repliesHtml += `
                        <div class="reply-item">
                            <div class="comment-author">
                                <span>↪ ${r.name} <span class="comment-date">${r.date}</span></span>
                                <button class="del-btn" onclick="deleteComment(${item.id}, ${r.id})">삭제</button>
                            </div>
                            <div class="comment-body">${r.text}</div>
                        </div>
                    `;
                });
                repliesHtml += `</div>`;
            }

            div.innerHTML = `
                <div class="comment-author">
                    <span>👤 ${item.name} <span class="comment-date">${item.date}</span></span>
                    <button class="del-btn" onclick="deleteComment(${item.id})">삭제</button>
                </div>
                <div class="comment-body">${item.text}</div>
                
                <div class="action-btns">
                    <button class="reply-btn" onclick="toggleReplyForm(${item.id})">답글 달기</button>
                </div>

                <div id="reply-form-box-${item.id}" class="reply-form" style="display:none;">
                    <input type="text" id="reply-name-${item.id}" class="comment-input-name" style="width:80px;" value="선생님">
                    <input type="text" id="reply-input-${item.id}" class="comment-input-text" placeholder="답글을 남겨주세요...">
                    <button class="btn-submit-comment" style="padding:4px 10px; font-size:12px;" onclick="addReply(${item.id})">등록</button>
                </div>
                ${repliesHtml}
            `;
            box.appendChild(div);
        });
    }
</script>

</body>
</html>
